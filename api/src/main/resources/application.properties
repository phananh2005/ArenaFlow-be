spring.application.name=ArenaFlow
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arenaflow}
spring.datasource.username=${DATABASE_USERNAME:arenaflow}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT: secret base64 >=256 bit tu env JWT_SECRET
arenaflow.jwt.secret=${JWT_SECRET}
arenaflow.jwt.access-token-ttl=1h
arenaflow.jwt.refresh-token-ttl=7d

# API docs: mac dinh TAT (fail-closed); chi bat o dev bang env SPRINGDOC_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# PII: pgjdbc mac dinh dua "Detail: Key (cot)=(gia tri)" vao message loi SQL -> lot vao log Hibernate/app.
# Tat de message chi con ten constraint (nhan dien TEAM_003 dua tren ten index van hoat dong).
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
