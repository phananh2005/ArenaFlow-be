spring.application.name=ArenaFlow
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/arenaflow}
spring.datasource.username=${DATABASE_USERNAME:arenaflow}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# JWT: secret base64 >=256 bit tu env JWT_SECRET
arenaflow.jwt.secret=${JWT_SECRET}
arenaflow.jwt.access-token-ttl=1h
arenaflow.jwt.refresh-token-ttl=7d

# Cloudinary: signed direct uploads; credentials are supplied only through environment variables.
arenaflow.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
arenaflow.cloudinary.api-key=${CLOUDINARY_API_KEY:}
arenaflow.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
arenaflow.cloudinary.folder=${CLOUDINARY_FOLDER:}

# Stale venue alert (180 days unused): daily at off-peak 03:00 Asia/Ho_Chi_Minh; "-" disables the job.
arenaflow.venue.stale-alert.cron=${VENUE_STALE_ALERT_CRON:0 0 3 * * *}
arenaflow.venue.stale-alert.stale-days=180
arenaflow.venue.stale-alert.batch-size=500
arenaflow.venue.stale-alert.max-batches-per-run=20

# Venue image orphan cleanup (Cloudinary Admin API): OFF unless VENUE_IMAGE_CLEANUP_CRON is set (e.g. 0 30 3 * * *);
# enabling requires a dedicated per-environment CLOUDINARY_FOLDER (startup fails otherwise).
arenaflow.venue.image-cleanup.cron=${VENUE_IMAGE_CLEANUP_CRON:-}
arenaflow.venue.image-cleanup.grace=24h
arenaflow.venue.image-cleanup.confirm-window=6h
arenaflow.venue.image-cleanup.clock-skew=5m
arenaflow.venue.image-cleanup.page-size=500
arenaflow.venue.image-cleanup.max-admin-calls-per-run=100
arenaflow.venue.image-cleanup.connect-timeout=5s
arenaflow.venue.image-cleanup.read-timeout=30s

# Job vòng đời kèo (chuyển OPEN quá expiresAt sang EXPIRED, chuyển CONFIRMED quá giờ kết thúc sang ARCHIVED):
# cron 6 trường (giây phút giờ ngày tháng thứ), mặc định mỗi 5 phút; đặt "-" để tắt job.
# batch-size: số kèo tối đa xử lý mỗi lô (mặc định 200); max-batches-per-run: số lô tối đa mỗi lần chạy (mặc định 50).
arenaflow.match.lifecycle.cron=${MATCH_LIFECYCLE_CRON:0 */5 * * * *}
arenaflow.match.lifecycle.batch-size=200
arenaflow.match.lifecycle.max-batches-per-run=50
# Bể luồng dùng chung cho mọi job @Scheduled trong ứng dụng (số luồng, mặc định 5 để mỗi job định kỳ có 1 luồng riêng).
spring.task.scheduling.pool.size=5

# Kênh realtime STOMP (/ws): danh sách mẫu origin FE được phép kết nối, phân cách bằng dấu phẩy (vd https://app.example.com).
# Mặc định để trống = chỉ cho phép same-origin (fail-closed); không bao giờ đặt "*".
# heartbeat-ms: chu kỳ nhịp tim STOMP hai chiều tính bằng mili-giây (mặc định 10000 = 10 giây).
arenaflow.websocket.allowed-origin-patterns=${WS_ALLOWED_ORIGIN_PATTERNS:}
arenaflow.websocket.heartbeat-ms=10000

# API docs: mac dinh TAT (fail-closed); chi bat o dev bang env SPRINGDOC_ENABLED=true
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# PII: pgjdbc mac dinh dua "Detail: Key (cot)=(gia tri)" vao message loi SQL -> lot vao log Hibernate/app.
# Tat de message chi con ten constraint (nhan dien TEAM_003 dua tren ten index van hoat dong).
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
